services:
  # 見守りサーバー (Node.js + Python/YOLOv8-Pose)
  # インターネットはもちろん、同じLAN内からも直接アクセスできないよう
  # ポートは公開せず、webサービスからのみ到達できるようにしている。
  server:
    build: ./server
    container_name: system1-server
    restart: unless-stopped
    expose:
      - "3001"
    networks:
      - internal

  # 公開用Webサーバー (Caddy: 静的ファイル配信 + /socket.io/ 中継 + 自動HTTPS)
  web:
    build:
      context: ./client
      args:
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
        # AWS Cognito / IoT Core / 履歴API(Role C仕様書 Step 1/3/5)。
        # 値は .env.example (→ .env) 参照。パスワード等の秘密情報はここには乗せない。
        VITE_AWS_REGION: ${VITE_AWS_REGION:-}
        VITE_COGNITO_USER_POOL_ID: ${VITE_COGNITO_USER_POOL_ID:-}
        VITE_COGNITO_CLIENT_ID: ${VITE_COGNITO_CLIENT_ID:-}
        VITE_COGNITO_IDENTITY_POOL_ID: ${VITE_COGNITO_IDENTITY_POOL_ID:-}
        VITE_IOT_ENDPOINT: ${VITE_IOT_ENDPOINT:-}
        VITE_HISTORY_API_URL: ${VITE_HISTORY_API_URL:-}
    container_name: system1-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-http://localhost}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
